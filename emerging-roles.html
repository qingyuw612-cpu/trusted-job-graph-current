    function mergeRoles(base, updates) {
      const merged = base.map((role) => ({ ...role, markers: role.markers ? [...role.markers] : [], changeNotes: [] }));
      for (const update of updates) {
        const target = merged.find((role) => role.id === update.duplicateOf || normalize(role.name) === normalize(update.name));
        if (target) {
          if (!target.markers.includes(update.marker)) target.markers.push(update.marker);
          target.changeNotes.push(update);
          for (const skill of update.skills || []) {
            if (!target.required.includes(skill) && !target.bonus.includes(skill)) target.bonus.push(skill);
          }
          target.jobs = Math.max(target.jobs, update.jobs || 0);
          target.score = Math.max(target.score, Math.min(99, target.score + (update.scoreDelta || 0) / 20));
        } else {
          merged.push({
            id: update.id,
            name: update.name,
            type: update.type || "新兴岗位",
            score: 76 + (update.scoreDelta || 0) / 2,
            jobs: update.jobs || 0,
            companies: Math.max(1, Math.round((update.jobs || 0) * 0.82)),
            templates: update.jobs || 0,
            consensus: update.kind === "new" ? 74 : 68,
            status: "待审核",
            summary: update.desc,
            responsibilities: ["明确岗位边界、业务场景和交付对象", "梳理核心能力要求并回溯招聘证据", "判断该岗位是否需要进入新岗位定义池"],
            required: update.skills || [],
            bonus: [],
            industries: ["计算机软件", "互联网 / 电子商务", "数据服务"],
            markers: [update.marker],
            changeNotes: [update],
          });
        }
      }
      return merged;
    }

    function filteredRoles() {
      const q = $("search").value.trim().toLowerCase();

        return !q || haystack.includes(q);
      }).sort((a, b) => b.score - a.score);
    }

      `).join("") : roles.length ? emptyState("没有符合当前条件的岗位") : "";

    async function applyReview(action) {
      const role = roles.find((item) => item.id === selectedId);
      if (!role) return;
      if (!reviewStorageAvailable) {
        $("reviewFeedback").textContent = "Neo4j 审核版本库当前不可用，本次操作不会假装保存。";
        $("reviewFeedback").className = "review-feedback is-danger";
        return;
      }
      const note = $("reviewNote").value.trim();
      const actionMap = {
        reject: ["暂不纳入", "REJECT_NOISE", "已保存：暂不纳入。"],
        evidence: ["需要更多依据", "WATCH", "已保存：需要更多依据。"],
        approve: ["已确认", "CONFIRM_NEW_ROLE", "已保存：岗位定义已进入审核版本。"],
      };
      const [status, decision, message] = actionMap[action] || actionMap.evidence;
      if (!role.taskId || !role.candidateId) {
        $("reviewFeedback").textContent = "当前候选没有可保存的任务记录，请先加载真实雷达结果。";
        $("reviewFeedback").className = "review-feedback is-warn";
        return;
      }
      const comment = note || `知途工作台审核：${status}`;
      $("reviewFeedback").textContent = "正在保存审核结果…";
      $("reviewFeedback").className = "review-feedback is-warn";
      try {
        const saved = await fetch(`${evolutionApi}/runs/${encodeURIComponent(role.taskId)}/candidates/${encodeURIComponent(role.candidateId)}/review`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            expected_version: Number(role.reviewVersion || 0),
            decision,
            reviewer: "知途工作台",
            comment,
            definition: {
              name: role.name,
              parent_role_id: "",
              core_responsibilities: role.responsibilities,
              required_skills: role.required,
              bonus_skills: role.bonus,
              industry_scenarios: role.industries,
              expert_supplied_fields: note ? ["core_responsibilities", "required_skills", "bonus_skills", "industry_scenarios"] : [],
            },
          }),
        }).then(async (response) => {
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(payload.message || payload.error || `HTTP ${response.status}`);
            return payload;
          });
        role.status = status;
        role.reviewVersion = Number(saved.candidate_version ?? role.reviewVersion ?? 0);
        render();
        $("reviewNote").value = note;
        $("reviewFeedback").textContent = note ? `${message} 修改说明已保存。` : message;
        $("reviewFeedback").className = `review-feedback ${action === "approve" ? "is-ok" : action === "reject" ? "is-danger" : "is-warn"}`;
        setStatus("pageStatus", `${role.name} · ${status}`, action === "reject" ? "warn" : "ok");
      } catch (error) {
        $("reviewFeedback").textContent = `保存失败：${error.message}`;
        $("reviewFeedback").className = "review-feedback is-danger";
        setStatus("pageStatus", "审核结果未保存", "warn");
      }
    }

    function renderUpdateFilters() {
      const filters = [["all","全部"],["added","新增能力"],["increased","能力增强"],["decreased","能力减弱"],["missing","当前窗口未出现"]];
      $("updateFilters").innerHTML = filters.map(([key, label]) => (
        `<button class="${updateFilter === key ? "active" : ""}" type="button" data-filter="${key}">${esc(label)}</button>`
      )).join("");
      $("updateFilters").querySelectorAll("button").forEach((button) => {
        button.onclick = () => {
          updateFilter = button.dataset.filter;
          renderUpdateFilters();
          renderUpdates();
        };
      });
    }

    function renderUpdates() {
      const stateMessages = {
        loading: "正在读取真实演化数据…",
        empty: "",
        "ready-empty": "",
        running: "岗位能力演化任务正在运行，请稍后刷新",
        failed: "岗位能力演化结果读取失败",
        offline: "API 离线，无法读取岗位能力演化结果",
        ready: "",
      };
      const message = stateMessages[evolutionState] ?? stateMessages.empty;
      const demoNotice = usingDemoUpdates ? "演示数据（?demo=1）" : "";
      $("updateState").textContent = demoNotice || evolutionMeta.note || message;
      $("updateState").hidden = !message && !demoNotice && !evolutionMeta.note;
      const rows = abilityUpdates.map((role) => ({
        ...role,
        items: role.items.filter((item) => updateFilter === "all" || item.type === updateFilter),
      })).filter((role) => role.items.length).sort((a, b) => (
        Number(b.focus || 0) - Number(a.focus || 0)
        || b.items.length - a.items.length
        || String(a.name).localeCompare(String(b.name), "zh-CN")
      ));
      $("updateCards").innerHTML = rows.length ? rows.map((role) => {
        const sortedItems = [...role.items].sort((a, b) => Math.abs(Number(b.delta || 0)) - Math.abs(Number(a.delta || 0)));
        const visibleItems = sortedItems.slice(0, 8);
        const remainingItems = sortedItems.slice(8);
        const roleEvidence = [
          role.baselineRoleCompanies == null ? "" : `基线 ${fmtNumber(role.baselineRoleCompanies)} 家企业`,
          role.currentRoleCompanies == null ? "" : `当前 ${fmtNumber(role.currentRoleCompanies)} 家企业`,
          role.sourceFamilies?.length ? `来源：${role.sourceFamilies.map(esc).join("、")}` : "",
        ].filter(Boolean).join(" · ");
        return `
        <article class="change-card">
          <div class="change-card-main">
            <div class="change-title-row">
              <div>
                <h3 class="truncate" title="${esc(role.name)}">${esc(role.name)}</h3>
                <p>${esc(role.meta)}${roleEvidence ? ` · ${roleEvidence}` : ""}</p>
              </div>
              <span class="badge increased">变化峰值 ${deltaCompactText(role.focus)}</span>
            </div>
            <div class="ability-list">
              ${visibleItems.map((item) => abilityRow(item)).join("")}
            </div>
            ${remainingItems.length ? `
              <details class="ability-more">
                <summary>展开其余 ${remainingItems.length} 项能力变化</summary>
                <div class="ability-list ability-list-more">${remainingItems.map((item) => abilityRow(item)).join("")}</div>
              </details>
            ` : ""}
          </div>
        </article>
      `}).join("") : "";
    }

    function switchView(view, syncUrl = true) {
      activeView = view;
      $("discoveryView").hidden = view !== "discovery";
      $("legacyRoleUpdates").hidden = view !== "updates";
      $("discoveryToolbar").hidden = view !== "discovery";
      if (syncUrl) {
        const url = new URL(location.href);
        if (view === "discovery") url.searchParams.delete("view");
        else url.searchParams.set("view", view);
        history.replaceState(null, "", url);
      }
    }

    function abilityRow(item) {
      const type = item.type;
      const label = type === "added" ? "新增" : type === "increased" ? "增强" : type === "missing" ? "未出现" : "减弱";
      const className = type === "added" ? "is-added" : type === "increased" ? "is-increased" : "is-decreased";
      const evidence = (item.evidence || []).filter((row) => row && row.text);
      const baseline = coverageText(item.baseline_coverage);
      const current = coverageText(item.current_coverage);
      const delta = deltaCompactText(item.delta);
      return `
        <div class="ability-row ${className}" title="基线覆盖 ${baseline}，当前覆盖 ${current}，较基线 ${delta}">
          <span class="ability-name truncate" title="${esc(item.skill)}">${esc(item.skill)}</span>
          <span class="badge ${esc(type)}">${label}</span>
          <span class="ability-current"><small>当前覆盖</small><b>${current}</b></span>
          <span class="ability-delta" aria-label="较基线变化 ${deltaText(item.delta)}">${delta}</span>
          <span class="ability-company">${item.current_company_count == null ? "—" : `${fmtNumber(item.current_company_count)} 家`}</span>
          ${evidence.length ? `<details class="ability-evidence"><summary>依据 ${evidence.length}</summary>${evidence.map((row) => `<p>${esc(humanSource(row.source_family || "招聘JD"))}：${esc(row.text)}</p>`).join("")}</details>` : `<span class="ability-no-evidence">暂无依据</span>`}
        </div>
      `;
    }

    function coverageText(value) {
      return value == null || !Number.isFinite(Number(value)) ? "—" : fmtPercent(Number(value), 1);
    }

    function deltaText(value) {
      if (value == null || !Number.isFinite(Number(value))) return "—";
      const points = Number(value) * 100;
      return `${points >= 0 ? "+" : ""}${fmtNumber(points, 1)} 个百分点`;
    }

    function deltaCompactText(value) {
      if (value == null || !Number.isFinite(Number(value))) return "—";
      const points = Number(value) * 100;
      return `${points >= 0 ? "+" : ""}${fmtNumber(points, 1)}pp`;
    }

    function markerBadge(marker) {
      const cls = marker === "新增岗位" || marker === "新增能力" ? "new" : marker === "新兴细分" || marker === "能力增强" ? "special" : "decreased";
      return `<span class="badge ${cls}">${esc(marker)}</span>`;
    }

    function normalize(value) {
      return String(value || "").replace(/\s+/g, "").toLowerCase();
    }

    function populateIndustries() {
      // 分类筛选已从新岗位页面移除，保留空函数兼容数据加载流程。
    }

    function showFallbackDiscovery(reason, quiet = false) {
      const fallbackRoles = (demoMode ? baseRoles : []).map((role) => ({
        ...role,
        id: `fallback-${role.id}`,
        type: "低置信兜底候选",
        status: "待补证据",
        markers: ["低置信度", "演示兜底"],
        changeNotes: [],
      }));
      roles.splice(0, roles.length, ...fallbackRoles);
      selectedId = roles[0]?.id || "";
      populateIndustries();
      render();
      $("pageStatus").hidden = quiet;
      if (quiet) return;
      setStatus(
        "pageStatus",
        demoMode
          ? `${reason}；当前仅展示 ${roles.length} 个明确标注的演示候选`
          : `${reason}；当前没有可展示的真实岗位结果`,
        "warn"
      );
    }

    async function requestEvolution(path, options = {}) {
      const response = await fetch(`${evolutionApi}${path}`, options);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.message || "岗位演化服务暂时无法读取");
      return data;
    }

    function liveItems(values, limit = 8) {
      return [...new Set((values || []).map((value) => {
        if (typeof value === "string") return value.trim();
        return String(value?.skill || value?.name || value?.text || "").trim();
      }).filter(Boolean))].slice(0, limit);
    }

    function aiCoreResponsibilities(candidate, analysis, semanticSource) {
      if (semanticSource.includes("LLM_DEFINITION") || semanticSource.includes("EVIDENCE_SUMMARY_FALLBACK")) {
        return liveItems(analysis.core_responsibilities || [], 3);
      }
      return [];
    }

    function humanSource(value) {
      const text = String(value || "").trim();
      const renamed = text.replace(/\u0035\u0038同城/gi, "51job");
      return /(^|[/_-])58([/_.-]|$)/i.test(renamed) ? "51job" : renamed;
    }

    function liveRole(candidate, taskId) {
      const analysis = candidate.semantic_review?.analysis || {};
      const semanticSource = String(candidate.semantic_review?.source || "");
      const mechanicalDefinition = candidate.mechanical_definition || {};
      const reviewState = candidate.human_review?.current_state || "";
      const sourceCount = Number(candidate.independent_source_count || 0);
      const continuousMonths = Number(candidate.continuous_windows || 0);
      const semanticClass = analysis.semantic_class || candidate.candidate_class || "UNCLASSIFIED";
      const generatedRequired = liveItems(analysis.required_skills || [], 8);
      const required = generatedRequired.length ? generatedRequired : liveItems(mechanicalDefinition.required_skills || candidate.required_skill_draft || [], 8);
      const generatedBonus = liveItems(analysis.bonus_skills || [], 8);
      const bonus = (generatedBonus.length ? generatedBonus : liveItems(mechanicalDefinition.bonus_skills || candidate.bonus_skill_draft || [], 8)).filter((item) => !required.includes(item));
      const evidence = (candidate.responsibility_evidence || []).filter(Boolean);
      const aiResponsibilities = aiCoreResponsibilities(candidate, analysis, semanticSource);
      const responsibilities = aiResponsibilities.length
        ? aiResponsibilities
        : liveItems(mechanicalDefinition.core_responsibilities || evidence, 3);
      if (!responsibilities.length) responsibilities.push("当前未抽取到职责原文，请在人工审核中补充。");
      const generatedIndustries = liveItems(analysis.industry_scenarios || [], 5);
      const typicalIndustries = (candidate.typical_industries || []).map((item) => item.industry).filter(Boolean);
      const aiDefinitionStatus = String(candidate.ai_definition_status || "MECHANICAL_EVIDENCE_FALLBACK");
      const aiDefinitionLabel = aiDefinitionStatus === "AI_GENERATED"
        ? "讯飞 Spark Lite 已生成，待人工确认"
        : aiDefinitionStatus === "AI_PARTIAL_MECHANICAL_FALLBACK"
          ? "讯飞 Spark Lite 部分生成，已用招聘证据降级补全"
          : "讯飞 Spark Lite 未完整生成，已用招聘证据降级整理";
      const reviewLabel = reviewState === "CONFIRMED_NEW_ROLE" ? "已确认" : reviewState === "WATCHING" ? "需要更多依据" : reviewState === "REJECTED" ? "暂不纳入" : candidate.rule_state === "REVIEW" ? "待确认" : "待补证据";
      const markers = [candidate.rule_state === "REVIEW" ? "待确认" : "观察中"];
      if (candidate.discovery_type) markers.push(candidate.discovery_type === "NEW_TITLE" ? "近期出现" : "需求上升");
      if (sourceCount < 2) markers.push("来源待拓展");
      if (continuousMonths < 2) markers.push("持续观察");
      if (semanticSource.includes("LLM_DEFINITION")) markers.push("AI建议已生成");
      else markers.push("AI建议可选");
      return {
        ...candidate,
        id: candidate.candidate_id,
        candidateId: candidate.candidate_id,
        taskId,
        name: candidate.display_name || analysis.canonical_name || candidate.candidate_title,
        type: semanticClass === "NEW_ROLE" ? "全新岗位候选" : semanticClass === "SPECIALIZATION" || candidate.publication_basis === "FUNCTIONAL_SPECIALIZATION_WITH_SKILL_EVIDENCE" ? "新兴细分候选" : "边界待判断",
        score: Number(candidate.emergence_score || 0),
        jobs: Number(candidate.current_jd_count || 0),
        companies: Number(candidate.current_company_count || 0),
        templates: Number(candidate.current_template_count || 0),
        firstSeen: candidate.first_seen || "",
        lastSeen: candidate.last_seen || "",
        sources: sourceCount,
        continuousMonths,
        growthWindows: Number(candidate.growth_windows || 0),
        consensus: sourceCount,
        status: reviewLabel,
        summary: analysis.role_boundary || mechanicalDefinition.role_boundary || `近期由 ${Number(candidate.current_company_count || 0)} 家企业、${Number(candidate.current_template_count || 0)} 个独立招聘模板形成岗位信号；当前仍需补充独立来源或持续月份证据。`,
        descriptionSource: aiDefinitionLabel,
        aiDefinitionStatus,
        aiDefinitionLabel,
        responsibilities,
        required,
        bonus,
        industries: generatedIndustries.length ? generatedIndustries : typicalIndustries,
        sourceFamilies: (candidate.source_distribution || []).map((item) => humanSource(item.source_family)).filter(Boolean),
        evidence: evidence.map((item) => ({ ...item, source_family: humanSource(item.source_family || "招聘 JD") })),
        evidenceCount: evidence.length,
        reviewVersion: Number(candidate.human_review?.candidate_version || 0),
        reasons: candidate.rule_reasons || [],
        trend: candidate.monthly_trend || [],
        rawTitleVariants: candidate.raw_title_variants || [],
        sourceDistribution: candidate.source_distribution || [],
        markers,
        changeNotes: [],
      };
    }

    async function loadLiveDiscovery() {
      try {
        const snapshot = await requestEvolution("/runs/latest-public");
        const item = snapshot.task || {};
        if (snapshot.status !== "ready" || !item.task_id) {
          showFallbackDiscovery("", true);
          return;
        }
        const result = await requestEvolution(`/runs/${encodeURIComponent(item.task_id)}/result`);
        const published = { item, result };
        liveResult = published.result;
        const task = published.result.task || {};
        const summary = task.summary || published.result.manifest?.summary || {};
        const funnel = published.result.data_quality?.role_discovery?.funnel || summary.role_funnel || {};
        const liveRoles = (published.result.new_role_candidates || [])
          .filter((item) => item.publication_state === "PUBLISHED_CANDIDATE" || item.human_review?.current_state === "CONFIRMED_NEW_ROLE")
          .map((item) => liveRole(item, published.item.task_id));
        roles.splice(0, roles.length, ...liveRoles);
        selectedId = roles[0]?.id || "";
        totalCandidateCount = roles.length;
        const snapshotNote = snapshot.is_historical_snapshot
          ? " · 最新小批增量已处理，当前保留最近完整快照"
          : "";
        $("discoveryMeta").textContent = roles.length
          ? `真实岗位名称 · 共 ${roles.length} 个岗位方向 · 点击查看招聘依据${snapshotNote}`
          : `本轮没有达到展示条件的新岗位`;
        reviewStorageAvailable = published.result.review_storage?.available === true;
        document.querySelectorAll("[data-review-action]").forEach((button) => {
          button.disabled = !reviewStorageAvailable;
        });
        $("reviewFeedback").textContent = reviewStorageAvailable
          ? ""
          : "Neo4j 审核版本库当前不可用，审核按钮已停用。";
        $("reviewFeedback").className = `review-feedback ${reviewStorageAvailable ? "" : "is-danger"}`;
        populateIndustries();
        render();
        await loadLiveEvolution();
        $("pageStatus").hidden = roles.length === 0;
        if (roles.length) setStatus("pageStatus", `真实岗位演化结果已加载 · ${roles.length} 个候选`, "ok");
      } catch (error) {
        showFallbackDiscovery(`新岗位演化 API 暂不可用 · ${error.message}`);
      }
    }

    async function loadLiveEvolution() {
      evolutionState = "loading";
      renderUpdates();
      try {
        const result = await requestEvolution("/skill-changes/latest");
        const task = result?.task || {};
        const changes = result?.role_skill_changes || [];
        evolutionState = "ready";
        const completedAt = String(task.completed_at || "").replace("T", " ").slice(0, 16);
        evolutionMeta = {};
        if (!demoMode) usingDemoUpdates = false;
        const grouped = new Map();
        for (const item of changes) {
          if (!item.role || !item.skill) continue;
          const type = item.change_type === "ADDED_CANDIDATE" ? "added" : item.change_type === "INCREASED" ? "increased" : item.change_type === "DECREASED" ? "decreased" : item.change_type === "MISSING_WATCH" ? "missing" : "decreased";
          const row = grouped.get(item.role) || {
            name: item.role,
            meta: "岗位能力变化",
            focus: 0,
            items: [],
            sourceFamilies: [],
            baselineRoleCompanies: null,
            currentRoleCompanies: null,
          };
          row.focus = Math.max(row.focus, Math.abs(Number(item.delta || 0)));
          row.items.push({ ...item, type });
          row.baselineRoleCompanies = Math.max(
            Number(row.baselineRoleCompanies || 0),
            Number(item.baseline_role_companies || 0),
          );
          row.currentRoleCompanies = Math.max(
            Number(row.currentRoleCompanies || 0),
            Number(item.current_role_companies || 0),
          );
          for (const evidence of (item.evidence || [])) {
            const family = humanSource(evidence?.source_family || "");
            if (family && !row.sourceFamilies.includes(family)) row.sourceFamilies.push(family);
          }
          grouped.set(item.role, row);
        }
        abilityUpdates = [...grouped.values()].sort((a, b) => (
          Number(b.focus || 0) - Number(a.focus || 0)
          || b.items.length - a.items.length
          || String(a.name).localeCompare(String(b.name), "zh-CN")
        ));
        if (!abilityUpdates.length) evolutionState = "ready-empty";
        const changeCount = changes.filter((item) => item.role && item.skill).length;
        $("updateMeta").textContent = changeCount
          ? `共 ${abilityUpdates.length} 个岗位 · ${changeCount} 项能力变化 · 每个岗位默认展示变化最大的 8 项${completedAt ? ` · 结果时间 ${completedAt}` : ""}`
          : "";
        renderUpdates();
      } catch (error) {
        evolutionState = "offline";
        evolutionMeta = {};
        if (!demoMode) abilityUpdates = [];
        $("updateMeta").textContent = "无法连接岗位能力演化 API";
        renderUpdates();
        setStatus("pageStatus", `岗位能力演化 API 离线 · ${error.message}`, "warn");
      }
    }

    populateIndustries();
    $("search").addEventListener("input", render);
    document.querySelectorAll("[data-review-action]").forEach((button) => {
      button.onclick = () => applyReview(button.dataset.reviewAction);
    });
    $("reset").onclick = () => {
      $("search").value = "";
      selectedId = roles[0]?.id || "";
      switchView("discovery");
      render();
    };
    setStatus("pageStatus", demoMode ? "演示数据已加载（?demo=1）" : "正在读取真实数据", demoMode ? "warn" : "warn");
    renderUpdateFilters();
    renderUpdates();
    render();
    switchView(activeView, false);
    if (demoMode) {
      // 只有显式 ?demo=1 才使用演示数据；生产模式不会用假候选填充页面。
      renderUpdates();
    } else {
      loadLiveDiscovery();
    }
  </script>
</body>
</html>

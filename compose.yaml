name: trusted-job-graph

services:
  app:
    build:
      context: .
      args:
        BASE_IMAGE: "${BASE_IMAGE:-python:3.12-slim}"
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DATA_BACKEND: demo
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)); assert d['status']=='ok'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

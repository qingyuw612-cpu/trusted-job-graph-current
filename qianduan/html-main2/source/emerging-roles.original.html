<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="基于 2026 年招聘数据发现并定义新兴岗位。">
  <title>2026 新岗位发现</title>
  <style>
    :root{--bg:#eef3f9;--panel:#fff;--ink:#17263a;--muted:#617086;--line:#d8e2ee;--brand:#3978ff;--brand2:#6d60ef;--brand-soft:#eaf1ff;--cyan:#19a889;--orange:#f26f3d;--amber:#f0a129;--shadow:0 10px 32px #203a6012;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #3978ff35;outline-offset:2px}
    .app-header{height:76px;padding:0 24px;color:#fff;display:flex;align-items:center;justify-content:space-between;background:radial-gradient(circle at 18% -140%,#a9c6ff 0,transparent 44%),linear-gradient(115deg,#3d73dd,#5f7fe5 58%,#776edd);border-bottom:1px solid #ffffff40;box-shadow:0 5px 20px #4668b628}
    .brand{display:flex;align-items:center;gap:13px}.brand-mark{position:relative;width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#5a8cff,#7d62ff);box-shadow:0 8px 28px #326aff55}.brand-mark i{position:absolute;width:6px;height:6px;border:1.5px solid #fff;border-radius:50%;background:#7890ff}.brand-mark i:nth-child(1){left:8px;top:16px}.brand-mark i:nth-child(2){left:24px;top:8px}.brand-mark i:nth-child(3){left:24px;top:24px}.brand-mark:before,.brand-mark:after{content:"";position:absolute;left:13px;width:14px;height:1px;background:#ffffffaa;transform-origin:left}.brand-mark:before{top:17px;transform:rotate(-28deg)}.brand-mark:after{top:20px;transform:rotate(28deg)}
    .eyebrow{font-size:11px;font-weight:800;letter-spacing:.18em;color:#dce8ff;text-transform:uppercase}.brand h1{font-size:21px;line-height:1.25;margin:2px 0 0}.status{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:999px;background:#ffffff20;border:1px solid #ffffff3d;font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:#36d399;box-shadow:0 0 0 4px #36d39918,0 0 16px #36d399aa}
    .toolbar{padding:12px 20px;background:#ffffffeb;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(240px,1.5fr) repeat(3,minmax(140px,.7fr)) auto;gap:10px;align-items:center;backdrop-filter:blur(18px)}
    .search{position:relative}.search:before{content:"⌕";position:absolute;left:12px;top:8px;color:#718198;font-size:19px}input,select{width:100%;height:40px;border:1px solid #ccd9e8;border-radius:9px;background:#fff;color:var(--ink);padding:0 11px}input{padding-left:38px}.primary{height:40px;border:0;border-radius:9px;color:#fff;padding:0 18px;background:linear-gradient(135deg,#3978ff,#695cff);box-shadow:0 7px 18px #3978ff35;font-weight:750}
    .content{padding:18px 20px 28px;max-width:1520px;margin:auto}.overview{display:grid;grid-template-columns:minmax(0,1.45fr) repeat(3,minmax(150px,.45fr));gap:12px;margin-bottom:14px}.hero,.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.hero{padding:20px 22px;position:relative;overflow:hidden;background:linear-gradient(135deg,#fff 10%,#f5f8ff)}.hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-70px;top:-105px;background:#6687ff13}.kicker{color:#5477bf;font-size:10px;font-weight:850;letter-spacing:.14em;text-transform:uppercase}.hero h2{font-size:24px;margin:4px 0 7px;letter-spacing:-.03em}.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.65}.stat{padding:17px 18px;position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:58px;height:58px;border-radius:50%;right:-20px;top:-20px;background:#5487ff14}.stat span{display:block;color:var(--muted);font-size:12px}.stat b{display:block;font-size:27px;margin-top:3px;letter-spacing:-.03em}.stat small{color:#7b8a9e;font-size:11px}
    .workspace{display:grid;grid-template-columns:minmax(460px,.92fr) minmax(560px,1.38fr);gap:14px;min-height:650px}.panel{overflow:hidden}.panel-head{min-height:59px;padding:10px 15px 10px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fff}.panel-title{display:flex;align-items:center;gap:10px}.panel-title:before{content:"";width:3px;height:25px;border-radius:4px;background:linear-gradient(#6c8cff,#5de0c2);box-shadow:0 0 14px #6c8cff}.panel-head h3{font-size:17px;margin:0}.panel-head small{display:block;color:#718198;font-size:10px;font-weight:650;letter-spacing:.05em}.rule{font-size:11px;color:#5477bf;background:var(--brand-soft);padding:6px 9px;border-radius:7px;font-weight:750}
    .list{padding:10px;background:#f8faff;display:grid;gap:8px;max-height:700px;overflow:auto}.role{width:100%;border:1px solid #dfe6ef;border-radius:12px;background:#fff;padding:14px 14px 13px;text-align:left;color:var(--ink);transition:.18s;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center}.role:hover{border-color:#a8bfee;box-shadow:0 5px 16px #385e9a12}.role.active{border-color:#6c8de1;background:linear-gradient(135deg,#fff,#f1f5ff);box-shadow:0 6px 20px #3978ff20}.rank{width:35px;height:35px;display:grid;place-items:center;border-radius:11px;color:#4269c5;background:#edf3ff;font-weight:850}.role:first-child .rank{color:#fff;background:linear-gradient(135deg,#ff8b56,#f1644a);box-shadow:0 5px 12px #f26f3d35}.role-name{font-size:16px;font-weight:850}.role-meta{color:var(--muted);font-size:11px;margin-top:4px;display:flex;gap:9px;flex-wrap:wrap}.score{text-align:right}.score b{display:block;color:#3169db;font-size:20px;line-height:1}.score small{color:var(--muted);font-size:10px}
    .detail{display:grid;grid-template-rows:auto auto 1fr;background:#fff}.detail-hero{padding:20px 22px 18px;background:radial-gradient(circle at 92% 0,#dbe7ff 0,transparent 35%),linear-gradient(145deg,#fff,#f8faff);border-bottom:1px solid var(--line)}.detail-top{display:flex;justify-content:space-between;gap:18px;align-items:start}.detail h2{font-size:27px;margin:3px 0 7px;letter-spacing:-.035em}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:6px 10px;background:#e7f8f2;color:#087754;font-size:11px;font-weight:800}.detail-note{color:var(--muted);font-size:12px;line-height:1.6;max-width:670px}.index-ring{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:conic-gradient(var(--brand) calc(var(--score)*1%),#e4ebf5 0);position:relative}.index-ring:before{content:"";position:absolute;inset:7px;background:#fff;border-radius:50%}.index-ring div{position:relative;text-align:center}.index-ring b{display:block;color:#285ec8;font-size:19px;line-height:1}.index-ring small{color:var(--muted);font-size:9px}.signals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 15px;border-bottom:1px solid var(--line);background:#fbfcff}.signal{padding:9px 10px;border-radius:9px;background:#f2f5fa;border:1px solid #e8edf4}.signal span{display:block;color:var(--muted);font-size:10px}.signal b{font-size:15px}.detail-body{padding:16px 18px 20px;overflow:auto;max-height:520px}.definition-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:11px}.block{border:1px solid var(--line);border-radius:11px;padding:14px;background:#fff}.block.wide{grid-row:span 2}.block h4{font-size:12px;margin:0 0 10px;display:flex;align-items:center;gap:7px}.block h4:before{content:"";width:7px;height:7px;border-radius:3px;background:var(--cyan);box-shadow:0 0 9px #19a88970}.block ul{margin:0;padding-left:18px;color:#40516a;font-size:12px;line-height:1.72}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:11px;padding:5px 8px;border-radius:7px;background:#eef3fa;color:#496079;border:1px solid #e1e8f1}.chip.required{background:#edf3ff;color:#2b63d9;border-color:#d8e5ff}.industry{display:flex;gap:8px;align-items:start;padding:8px 0;border-bottom:1px dashed #e3e9f0;font-size:12px;color:#40516a}.industry:last-child{border:0}.industry i{width:7px;height:7px;border-radius:50%;background:#b678ff;margin-top:6px;flex:0 0 auto}.method{margin-top:11px;padding:11px 13px;border-radius:10px;background:#f5f8fc;color:#5a6d84;font-size:11px;line-height:1.6;border-left:3px solid #6d83e8}
    .empty{padding:40px;text-align:center;color:var(--muted)}
    @media(max-width:1050px){.overview{grid-template-columns:1fr 1fr}.hero{grid-column:1/-1}.workspace{grid-template-columns:1fr}.list{max-height:none}.detail-body{max-height:none}.toolbar{grid-template-columns:1fr 1fr}.search{grid-column:1/-1}.primary{grid-column:1/-1}.status{display:none}}
    @media(max-width:620px){.app-header{padding:0 14px}.brand h1{font-size:17px}.content{padding:12px}.overview{grid-template-columns:1fr}.workspace{grid-template-columns:minmax(0,1fr)}.toolbar{padding:10px;grid-template-columns:1fr}.search,.primary{grid-column:auto}.definition-grid{grid-template-columns:1fr}.block.wide{grid-row:auto}.signals{grid-template-columns:1fr 1fr}.detail-top{display:block}.index-ring{margin-top:14px}.rule{display:none}}
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><div><div class="eyebrow">Talent Intelligence Graph</div><h1>新岗位发现 · 2026</h1></div></div>
    <div class="status"><i class="dot"></i><span>2026 数据快照已就绪</span></div>
  </header>
  <section class="toolbar" aria-label="岗位筛选">
    <div class="search"><input id="search" type="search" placeholder="搜索岗位、技能或行业" aria-label="搜索岗位、技能或行业"></div>
    <select id="industry" aria-label="行业筛选"><option value="">全部行业</option></select>
    <select id="type" aria-label="岗位类型"><option value="">全部类型</option><option>AI 工程化</option><option>数据基础设施</option><option>AI 内容生产</option><option>AI 产品化</option></select>
    <select id="sort" aria-label="排序方式"><option value="score">涌现指数优先</option><option value="companies">企业数量优先</option><option value="jobs">招聘数量优先</option></select>
    <button id="reset" class="primary" type="button">重置筛选</button>
  </section>
  <main class="content">
    <section class="overview">
      <article class="hero"><div class="kicker">2026 Emerging Roles</div><h2>识别今年集中涌现、边界逐渐清晰的新岗位</h2><p>基于 2026 年招聘岗位名称、职责、技能与企业覆盖度聚合，优先展示涌现最明显且定义证据更完整的岗位。</p></article>
      <article class="stat"><span>新定义岗位</span><b>176</b><small>进入岗位定义池</small></article>
      <article class="stat"><span>重点涌现岗位</span><b id="visibleCount">6</b><small>高信号候选</small></article>
      <article class="stat"><span>头部企业覆盖</span><b>343</b><small>去重企业</small></article>
    </section>
    <section class="workspace">
      <section class="panel">
        <div class="panel-head"><div class="panel-title"><div><h3>岗位涌现榜</h3><small>EMERGENCE RANKING</small></div></div><div class="rule" title="岗位新颖度 55% + 企业覆盖 20% + JD 强度 15% + 技能共识 10%">查看排序规则 ⓘ</div></div>
        <div id="roleList" class="list"></div>
      </section>
      <section class="panel detail">
        <div class="panel-head"><div class="panel-title"><div><h3>岗位定义</h3><small>ROLE DEFINITION</small></div></div><span class="badge">● 2026 新出现</span></div>
        <div id="detail"></div>
      </section>
    </section>
  </main>
  <script>
    const roles=[
      {id:'agent',name:'AI Agent开发工程师',type:'AI 工程化',score:93.6,jobs:79,companies:71,templates:79,consensus:73,summary:'将大模型能力工程化为可规划、可调用工具、可持续运行的智能体系统。',responsibilities:['设计并开发具备感知、任务规划、记忆管理与工具调用能力的 AI Agent','完成从原型验证、服务集成到企业级部署的全链路交付','围绕任务成功率、响应质量、稳定性与可观测性持续优化智能体','与产品及业务团队协作，将模糊流程转化为可执行的 Agent 工作流'],required:['Python','大模型（LLM）','RAG','Agent 开发','系统设计','软件工程'],bonus:['Prompt 工程','Docker','FastAPI','React','Kubernetes','性能优化'],industries:['互联网 / 电子商务','计算机软件','电子技术 / 半导体','通信 / 网络设备','专业服务']},
      {id:'ai-app',name:'AI应用工程师',type:'AI 工程化',score:89.4,jobs:177,companies:162,templates:175,consensus:81,summary:'面向具体业务场景完成大模型应用的需求分析、架构设计、开发和交付。',responsibilities:['分析业务需求并完成 AI 应用方案与系统架构设计','基于 Python、RAG 与模型 API 开发数据智能应用','建设可扩展、高可用并符合安全要求的 AI 能力模块','负责模型能力与企业既有系统、数据和流程的集成'],required:['Python','大模型（LLM）','RAG','人工智能基础','系统设计','软件工程'],bonus:['PyTorch','Java','SQL','数据分析','TensorFlow','需求分析'],industries:['计算机软件','互联网 / 电子商务','电子技术 / 半导体','工业自动化','交通 / 物流']},
      {id:'governance',name:'数据治理工程师',type:'数据基础设施',score:86.8,jobs:201,companies:163,templates:194,consensus:79,summary:'围绕数据标准、质量、血缘和平台化能力，建立可用、可信、可追踪的数据底座。',responsibilities:['参与数据采集、治理和服务平台的架构设计与开发','建立数据标准、质量规则、元数据与血缘管理机制','保障批流数据处理的准确性、时效性和稳定性','推动治理规范在业务域、数据仓库和分析应用中落地'],required:['SQL','数据治理','Python','数据建模','数据质量'],bonus:['Spark','Hadoop','ClickHouse','Linux','系统设计','性能优化'],industries:['计算机软件','互联网 / 电子商务','数据服务','交通 / 物流','金融 / 证券']},
      {id:'ai-video',name:'AI视频制作',type:'AI 内容生产',score:84.2,jobs:67,companies:53,templates:67,consensus:71,summary:'将生成式 AI 引入脚本、分镜、画面生成、动态剪辑与成片交付的内容生产链。',responsibilities:['拆解脚本并完成角色、世界观、视觉风格与分镜设计','使用生成式 AI 工具完成画面、动画和视频素材生产','统筹后期剪辑、合成、精修与风格一致性控制','沉淀提示词、素材与生产流程，提高内容产能和稳定性'],required:['生成式 AI 工具','视频制作','视觉叙事','新媒体运营'],bonus:['Prompt 工程','项目管理','模型训练','内容运营','品牌运营','设计经验'],industries:['影视 / 文化传播','互联网 / 电子商务','广告营销','娱乐 / 体育','计算机软件']},
      {id:'ai-pm',name:'AI产品经理',type:'AI 产品化',score:82.7,jobs:130,companies:100,templates:128,consensus:66,summary:'把业务问题抽象为可评估、可交付、可迭代的 AI 产品能力和应用流程。',responsibilities:['识别业务痛点，定义 AI 产品目标、边界与核心指标','设计人机协同流程、模型策略与异常兜底机制','编写 PRD 并协调算法、工程、数据和业务团队交付','通过评测、反馈和数据分析推动产品持续迭代'],required:['需求分析','PRD 文档','产品设计','项目管理','AI 基础'],bonus:['大模型（LLM）','RAG','数据分析','ToB 经验','软件工程','技术文档'],industries:['计算机软件','电子技术 / 半导体','专业服务','互联网 / 电子商务','通信 / 网络设备']},
      {id:'ai-engineer',name:'AI工程师',type:'AI 工程化',score:79.8,jobs:198,companies:174,templates:195,consensus:87,summary:'设计、开发与优化 AI 算法及服务，推动模型能力在真实业务系统中落地。',responsibilities:['参与 AI 算法、模型服务和应用模块的设计与开发','完成模型集成、后端服务开发、测试与持续优化','评估业务需求并形成可落地的 AI 技术方案','保障模型服务的性能、稳定性和工程交付质量'],required:['Python','大模型（LLM）','PyTorch','深度学习','RAG','软件工程'],bonus:['TensorFlow','机器学习','Docker','SQL','Prompt 工程','模型训练'],industries:['计算机软件','互联网 / 电子商务','专业服务','电子技术 / 半导体','数据服务']}
    ];
    let selected=roles[0].id;
    const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function filtered(){const q=$('search').value.trim().toLowerCase(),industry=$('industry').value,type=$('type').value,sort=$('sort').value;return roles.filter(r=>(!q||[r.name,r.type,...r.required,...r.bonus,...r.industries].join(' ').toLowerCase().includes(q))&&(!industry||r.industries.includes(industry))&&(!type||r.type===type)).sort((a,b)=>sort==='companies'?b.companies-a.companies:sort==='jobs'?b.jobs-a.jobs:b.score-a.score)}
    function render(){const list=filtered();$('visibleCount').textContent=list.length;$('roleList').innerHTML=list.length?list.map((r,i)=>`<button class="role ${r.id===selected?'active':''}" data-id="${r.id}" type="button"><span class="rank">${i+1}</span><span><span class="role-name">${esc(r.name)}</span><span class="role-meta"><span>${esc(r.type)}</span><span>${r.companies} 家企业</span><span>${r.jobs} 条 JD</span></span></span><span class="score"><b>${r.score.toFixed(1)}</b><small>涌现指数</small></span></button>`).join(''):'<div class="empty">没有符合当前条件的岗位</div>';document.querySelectorAll('.role').forEach(b=>b.onclick=()=>{selected=b.dataset.id;render()});const role=roles.find(r=>r.id===selected);if(role)renderDetail(role)}
    function renderDetail(r){$('detail').innerHTML=`<div class="detail-hero"><div class="detail-top"><div><div class="kicker">${esc(r.type)} · RANKED EMERGENCE</div><h2>${esc(r.name)}</h2><div class="detail-note">${esc(r.summary)}</div></div><div class="index-ring" style="--score:${r.score}"><div><b>${r.score.toFixed(1)}</b><small>涌现指数</small></div></div></div></div><div class="signals"><div class="signal"><span>招聘信息</span><b>${r.jobs} 条</b></div><div class="signal"><span>企业覆盖</span><b>${r.companies} 家</b></div><div class="signal"><span>去重模板</span><b>${r.templates} 个</b></div><div class="signal"><span>技能共识度</span><b>${r.consensus}%</b></div></div><div class="detail-body"><div class="definition-grid"><section class="block wide"><h4>核心职责</h4><ul>${r.responsibilities.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><section class="block"><h4>必备技能</h4><div class="chips">${r.required.map(x=>`<span class="chip required">${esc(x)}</span>`).join('')}</div></section><section class="block"><h4>加分技能</h4><div class="chips">${r.bonus.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></section><section class="block" style="grid-column:1/-1"><h4>典型行业应用场景</h4>${r.industries.map(x=>`<div class="industry"><i></i><span>${esc(x)}</span></div>`).join('')}</section></div><div class="method"><b>排序说明：</b>涌现指数 = 岗位新颖度 55% + 企业覆盖度 20% + 招聘强度 15% + 技能共识度 10%。岗位新颖度用于识别 2026 年新出现或边界明显重构的岗位名称，因此最前方同时代表“出现得多”和“新定义最清晰”。</div></div>`}
    const industries=[...new Set(roles.flatMap(r=>r.industries))].sort((a,b)=>a.localeCompare(b,'zh-CN'));$('industry').innerHTML+industries.map(x=>`<option>${esc(x)}</option>`).join('');['search','industry','type','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('reset').onclick=()=>{$('search').value='';$('industry').value='';$('type').value='';$('sort').value='score';selected=roles[0].id;render()};render();
  </script>
</body>
</html>

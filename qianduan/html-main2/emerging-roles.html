    const pageParams = new URLSearchParams(location.search);

    function mergeRoles(base, updates) {
      const merged = base.map((role) => ({ ...role, markers: role.markers ? [...role.markers] : [], changeNotes: [] }));
      for (const update of updates) {
        const target = merged.find((role) => role.id === update.duplicateOf || normalize(role.name) === normalize(update.name));
        if (target) {
          if (!target.markers.includes(update.marker)) target.markers.push(update.marker);
          target.changeNotes.push(update);
          for (const skill of update.skills || []) {
            if (!target.required.includes(skill) && !target.bonus.includes(skill)) target.bonus.push(skill);
          }
          target.jobs = Math.max(target.jobs, update.jobs || 0);
          target.score = Math.max(target.score, Math.min(99, target.score + (update.scoreDelta || 0) / 20));
        } else {
          merged.push({
            id: update.id,
            name: update.name,
            type: update.type || "新兴岗位",
            score: 76 + (update.scoreDelta || 0) / 2,
            jobs: update.jobs || 0,
            companies: Math.max(1, Math.round((update.jobs || 0) * 0.82)),
            templates: update.jobs || 0,
            consensus: update.kind === "new" ? 74 : 68,
            status: "待审核",
            summary: update.desc,
            responsibilities: ["明确岗位边界、业务场景和交付对象", "梳理核心能力要求并回溯招聘证据", "判断该岗位是否需要进入新岗位定义池"],
            required: update.skills || [],
            bonus: [],
            industries: ["计算机软件", "互联网 / 电子商务", "数据服务"],
            markers: [update.marker],
            changeNotes: [update],
          });
        }
      }
      return merged;
    }

    function filteredRoles() {
      const q = $("search").value.trim().toLowerCase();
      const industry = $("industry").value;
      const type = $("type").value;
      const sort = $("sort").value;
      return roles.filter((role) => {
        const haystack = [role.name, role.type, role.summary, role.status, ...role.markers, ...role.required, ...role.bonus, ...role.industries].join(" ").toLowerCase();
        return (!q || haystack.includes(q)) && (!industry || role.industries.includes(industry)) && (!type || role.type === type);
      }).sort((a, b) => {
        if (sort === "companies") return b.companies - a.companies;
        if (sort === "jobs") return b.jobs - a.jobs;
        if (sort === "consensus") return b.consensus - a.consensus;
        return b.score - a.score;
      });
    }

    function render() {
      const list = filteredRoles();
      $("visibleCount").textContent = `${list.length} 个候选`;
      $("roleRows").innerHTML = list.length ? list.map((role, index) => `
        <button class="candidate-row ${role.id === selectedId ? "is-selected" : ""}" data-id="${esc(role.id)}" type="button">
          <span class="candidate-rank">${index + 1}</span>
          <span class="candidate-main">
            <span class="candidate-name truncate" title="${esc(role.name)}">${esc(role.name)}</span>
            <span class="candidate-meta">
              <span>${esc(role.type)}</span>
              <span>${fmtNumber(role.companies)} 家企业</span>
              <span>${fmtNumber(role.jobs)} 条 JD</span>
            </span>
            <span class="chip-list" style="margin-top:7px">${role.markers.length ? role.markers.map(markerBadge).join("") : `<span class="tag">常规候选</span>`}</span>
          </span>
          <span class="candidate-score"><b>${fmtNumber(role.score, 1)}</b><span>涌现指数</span></span>
        </button>
      `).join("") : emptyState("没有符合当前条件的岗位");
      $("roleRows").querySelectorAll("button[data-id]").forEach((row) => {
        row.onclick = () => {
          selectedId = row.dataset.id;
          render();
        };
      });
      const selected = roles.find((role) => role.id === selectedId) || list[0];
      if (selected) renderDetail(selected);
    }

    function renderDetail(role) {
      $("roleName").textContent = role.name;
      $("roleMeta").textContent = `${role.type} / ${fmtNumber(role.companies)} 家企业 / ${fmtNumber(role.jobs)} 条 JD`;
      $("roleStatus").textContent = role.status;
      $("roleStatus").className = `tag ${role.status === "待补证据" ? "medium" : role.status === "建议通过" ? "ok" : role.status === "已驳回" ? "high" : ""}`;
      $("roleDetail").innerHTML = `
        <div class="detail-stack">
          <div class="metric-grid">
            <div class="metric"><span>涌现指数</span><strong class="num">${fmtNumber(role.score, 1)}</strong></div>
            <div class="metric"><span>技能共识</span><strong class="num">${fmtNumber(role.consensus)}%</strong></div>
            <div class="metric"><span>证据模板</span><strong class="num">${fmtNumber(role.templates)}</strong></div>
            <div class="metric"><span>企业覆盖</span><strong class="num">${fmtNumber(role.companies)}</strong></div>
          </div>

          <div>
            <h3 class="section-title">新增信号</h3>
            <div class="chip-list">${role.markers.length ? role.markers.map(markerBadge).join("") : `<span class="tag">常规候选</span>`}</div>
          </div>

          <div>
            <h3 class="section-title">岗位摘要</h3>
            <p class="muted">${esc(role.summary)}</p>
          </div>

          <div>
            <h3 class="section-title">核心职责</h3>
            <ol class="definition-list">${role.responsibilities.map((item) => `<li>${esc(item)}</li>`).join("")}</ol>
          </div>

          <div>
            <h3 class="section-title">必备技能</h3>
            <div class="chip-list">${role.required.map((item) => `<span class="chip required truncate" title="${esc(item)}">${esc(item)}</span>`).join("")}</div>
          </div>

          <div>
            <h3 class="section-title">加分技能</h3>
            <div class="chip-list">${role.bonus.map((item) => `<span class="chip truncate" title="${esc(item)}">${esc(item)}</span>`).join("")}</div>
          </div>

          <div class="notice">
            <b>排序口径：</b>涌现指数 = 岗位新颖度 55% + 企业覆盖度 20% + 招聘强度 15% + 技能共识度 10%。
          </div>
        </div>
      `;
    }

    function applyReview(action) {
      const role = roles.find((item) => item.id === selectedId);
      if (!role) return;
      const note = $("reviewNote").value.trim();
      const actionMap = {
        reject: ["已驳回", "已在当前页面标记为驳回，未写入数据库。"],
        evidence: ["待补证据", "已在当前页面标记为待补证据，后续需要补充 JD 原文或企业覆盖。"],
        approve: ["建议通过", "已在当前页面标记为建议通过，后续接入保存后再写入定义池。"],
      };
      const [status, message] = actionMap[action] || actionMap.evidence;
      role.status = status;
      render();
      $("reviewNote").value = note;
      $("reviewFeedback").textContent = note ? `${message} 审核理由已保留。` : `${message} 建议补充一条审核理由，方便后续追溯。`;
      $("reviewFeedback").className = `review-feedback ${action === "approve" ? "is-ok" : action === "reject" ? "is-danger" : "is-warn"}`;
      setStatus("pageStatus", `${role.name} · ${status}`, action === "reject" ? "warn" : "ok");
    }

    function renderUpdateFilters() {
      const filters = [["all","全部"],["added","新增能力"],["increased","能力增强"],["decreased","能力减少"],["missing","暂时缺失"]];
      $("updateFilters").innerHTML = filters.map(([key, label]) => (
        `<button class="${updateFilter === key ? "active" : ""}" type="button" data-filter="${key}">${esc(label)}</button>`
      )).join("");
      $("updateFilters").querySelectorAll("button").forEach((button) => {
        button.onclick = () => {
          updateFilter = button.dataset.filter;
          renderUpdateFilters();
          renderUpdates();
        };
      });
    }

    function renderUpdates() {
      const stateMessages = {
        loading: "正在读取真实演化数据…",
        empty: "暂无已完成的岗位能力演化结果",
        running: "岗位能力演化任务正在运行，请稍后刷新",
        failed: "岗位能力演化结果读取失败",
        offline: "API 离线，无法读取岗位能力演化结果",
        ready: "",
      };
      const message = stateMessages[evolutionState] ?? stateMessages.empty;
      const demoNotice = usingDemoUpdates ? "演示数据（?demo=1）" : "";
      $("updateState").textContent = demoNotice || message;
      $("updateState").hidden = !message && !demoNotice;
      const rows = abilityUpdates.map((role) => ({
        ...role,
        items: role.items.filter((item) => updateFilter === "all" || item.type === updateFilter),
      })).filter((role) => role.items.length);
      $("updateCards").innerHTML = rows.length ? rows.map((role) => `
        <article class="change-card">
          <div class="change-card-main">
            <div class="change-title-row">
              <div>
                <h3 class="truncate" title="${esc(role.name)}">${esc(role.name)}</h3>
                <p>${esc(role.meta)}</p>
              </div>
              <span class="badge increased">最大变化 ${deltaText(role.focus)}</span>
            </div>
            <div class="ability-list">
              ${role.items.map((item) => abilityRow(item)).join("")}
            </div>
          </div>
        </article>
      `).join("") : emptyState("暂无该类型能力变化");
    }

    function switchView(view, syncUrl = true) {
      activeView = view;
      $("discoveryView").hidden = view !== "discovery";
      $("legacyRoleUpdates").hidden = view !== "updates";
      $("viewTabs").querySelectorAll("button").forEach((button) => {
        button.classList.toggle("active", button.dataset.view === view);
        button.setAttribute("aria-pressed", String(button.dataset.view === view));
      });
      if (syncUrl) {
        const url = new URL(location.href);
        if (view === "discovery") url.searchParams.delete("view");
        else url.searchParams.set("view", view);
        history.replaceState(null, "", url);
      }
    }

    function abilityRow(item) {
      const type = item.type;
      const label = type === "added" ? "新增能力" : type === "increased" ? "能力增强" : type === "missing" ? "暂时缺失" : "能力减少";
      const className = type === "added" ? "is-added" : type === "increased" ? "is-increased" : "is-decreased";
      return `
        <div class="ability-row ${className}">
          <span class="ability-name truncate" title="${esc(item.skill)}">${esc(item.skill)}</span>
          <span class="badge ${esc(type)}">${label}</span>
          <span class="num">${coverageText(item.baseline_coverage)} → ${coverageText(item.current_coverage)}</span>
          <span class="num">${deltaText(item.delta)}</span>
          <span class="num">${item.current_company_count == null ? "—" : `${fmtNumber(item.current_company_count)} 家企业`}</span>
        </div>
      `;
    }

    function coverageText(value) {
      return value == null || !Number.isFinite(Number(value)) ? "—" : fmtPercent(Number(value), 1);
    }

    function deltaText(value) {
      if (value == null || !Number.isFinite(Number(value))) return "—";
      const points = Number(value) * 100;
      return `${points >= 0 ? "+" : ""}${fmtNumber(points, 1)} 个百分点`;
    }

    function markerBadge(marker) {
      const cls = marker === "新增岗位" || marker === "新增能力" ? "new" : marker === "新兴细分" || marker === "能力增强" ? "special" : "decreased";
      return `<span class="badge ${cls}">${esc(marker)}</span>`;
    }

    function normalize(value) {
      return String(value || "").replace(/\s+/g, "").toLowerCase();
    }

    function populateIndustries() {
      const selected = $("industry").value;
      const industries = [...new Set(roles.flatMap((role) => role.industries))].filter(Boolean).sort((a, b) => a.localeCompare(b, "zh-CN"));
      $("industry").innerHTML = `<option value="">全部行业</option>` + industries.map((item) => `<option>${esc(item)}</option>`).join("");
      if (industries.includes(selected)) $("industry").value = selected;
    }

    async function loadLiveDiscovery() {
      try {
        const data = await getJSON(`${graphBase}/api/v1/radar/results/latest`);
        if (data.status !== "ready") {
          if (data.status === "running") setStatus("pageStatus", "新岗位雷达任务运行中", "warn");
          else if (data.status === "failed") setStatus("pageStatus", "新岗位雷达结果失败", "warn");
          else setStatus("pageStatus", "暂无已完成的新岗位结果", "warn");
          return;
        }
        if (!data.candidates?.length) {
          roles.splice(0, roles.length);
          selectedId = "";
          populateIndustries();
          render();
          setStatus("pageStatus", "新岗位结果为空；旧岗位能力更新仍独立加载", "warn");
          return;
        }
        const liveRoles = data.candidates.map((item) => ({
          id: item.id,
          name: item.name,
          type: "实时涌现候选",
          score: Number(item.score || 0),
          jobs: Number(item.jobs || 0),
          companies: Number(item.companies || 0),
          templates: Number(item.templates || 0),
          consensus: Math.min(100, 55 + Number(item.sources || 0) * 8 + Number(item.growth_windows || 0) * 3),
          status: item.status || "待审核",
          summary: item.summary,
          responsibilities: ["核对岗位边界与独立企业证据", "复核核心能力共识与岗位命名", "确认后纳入受控岗位定义池"],
          required: (item.required || []).filter(Boolean),
          bonus: (item.bonus || []).filter(Boolean),
          industries: (item.industries || []).filter(Boolean),
          markers: ["雷达新发现"],
          changeNotes: [],
        }));
        roles.splice(0, roles.length, ...liveRoles);
        selectedId = roles[0].id;
        populateIndustries();
        render();
        setStatus("pageStatus", `雷达实时候选 ${roles.length} 个`, "ok");
      } catch (error) {
        setStatus("pageStatus", `新岗位 API 离线 · ${error.message}`, "warn");
      }
    }

    async function loadLiveEvolution() {
      evolutionState = "loading";
      renderUpdates();
      try {
        const data = await getJSON(`${graphBase}/api/v1/evolution/results/latest`);
        evolutionState = data.status || "empty";
        evolutionMeta = data;
        if (evolutionState === "ready") {
          usingDemoUpdates = false;
          const grouped = new Map();
          for (const item of data.changes || []) {
            if (!item.role || !item.skill) continue;
            const type = item.change_type === "ADDED_CANDIDATE" ? "added"
              : item.change_type === "INCREASED" ? "increased"
              : item.change_type === "DECREASED" ? "decreased"
              : item.change_type === "MISSING_WATCH" ? "missing" : "decreased";
            const row = grouped.get(item.role) || {
              name: item.role,
              meta: `任务 ${data.task_id || "—"} · ${formatWindow(data.observation_window)}`,
              focus: 0,
              items: [],
            };
            row.focus = Math.max(row.focus, Math.abs(Number(item.delta || 0)));
            row.items.push({ ...item, type });
            grouped.set(item.role, row);
          }
          abilityUpdates = [...grouped.values()];
        } else if (!demoMode) {
          abilityUpdates = [];
        }
        $("updateMeta").textContent = evolutionMeta.task_id
          ? `任务 ${evolutionMeta.task_id} · 完成于 ${evolutionMeta.completed_at || "—"} · ${formatWindow(evolutionMeta.observation_window)}`
          : "暂无任务信息";
        renderUpdates();
        if (evolutionState === "ready") setStatus("pageStatus", "岗位能力演化结果已加载", "ok");
      } catch (error) {
        evolutionState = "offline";
        evolutionMeta = {};
        usingDemoUpdates = demoMode;
        if (!demoMode) abilityUpdates = [];
        $("updateMeta").textContent = "无法连接岗位能力演化 API";
        renderUpdates();
        setStatus("pageStatus", `岗位能力演化 API 离线 · ${error.message}`, "warn");
      }
    }

    function formatWindow(window) {
      if (!window || typeof window !== "object") return "观察区间未提供";
      const parts = [];
      if (window.baseline_start) parts.push(`基线起点 ${window.baseline_start}`);
      if (window.cutoff) parts.push(`切分点 ${window.cutoff}`);
      if (window.as_of) parts.push(`当前截至 ${window.as_of}`);
      return parts.join(" · ") || "观察区间未提供";
    }

    populateIndustries();
    ["search", "industry", "type", "sort"].forEach((id) => {
      $(id).addEventListener(id === "search" ? "input" : "change", render);
    });
    $("viewTabs").querySelectorAll("button").forEach((button) => {
      button.onclick = () => switchView(button.dataset.view);
    });
    document.querySelectorAll("[data-review-action]").forEach((button) => {
      button.onclick = () => applyReview(button.dataset.reviewAction);
    });
    $("reset").onclick = () => {
      $("search").value = "";
      $("industry").value = "";
      $("type").value = "";
      $("sort").value = "score";
      selectedId = roles[0]?.id || "";
      switchView("discovery");
      render();
    };
    setStatus("pageStatus", demoMode ? "演示数据已加载（?demo=1）" : "正在读取真实数据", demoMode ? "warn" : "warn");
    renderUpdateFilters();
    renderUpdates();
    render();
    switchView(activeView, false);
    loadLiveDiscovery();
    loadLiveEvolution();
  </script>
</body>
</html>
